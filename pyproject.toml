[project]
name = "sage-v2"
version = "0.1.0"
description = "SAGE - Strategic Advisory & Guidance Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "structlog>=24.0",
    "httpx>=0.27",
    "croniter>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "textual>=0.80",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["web*", "brag*", "data*", "config*", "migrations*", "tests*"]

[project.optional-dependencies]
tokenizer = [
    "transformers>=4.36",
    "tiktoken>=0.7",
]
voice = [
    "aiortc>=1.9",
    "faster-whisper>=1.0",
    "onnxruntime>=1.16",
    "pyaudio>=0.2.13",
    "numpy>=1.24",
    "opuslib>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["BLE001"]