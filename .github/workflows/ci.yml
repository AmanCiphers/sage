name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          pip install -r requirements.txt
          pip install ruff

      - name: Tests
        run: python -m pytest tests/unit -q

      # F rules only: undefined names, unused imports, shadowed definitions.
      # This is the baseline that must never regress. The wider ruleset
      # (whitespace, PEP 604/585 typing) is tracked separately and is
      # deliberately not gated yet, so it cannot block unrelated work.
      - name: Lint (F rules)
        run: ruff check app main.py --select F

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
